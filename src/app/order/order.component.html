<app-window-frame [title]="orderViewModel.title" (closeClicked)="close()">
  <form class="of-form" [formGroup]="form" (ngSubmit)="book()">

    <div class="of-tabs">
      <button type="button" class="of-tab" [class.of-tab-active]="tab() === 'order'"
              (click)="tab.set('order')">Order</button>
      <button type="button" class="of-tab" [class.of-tab-active]="tab() === 'allocations'"
              (click)="tab.set('allocations')">Allocations ({{ allocations().length }})</button>
    </div>

    @if (tab() === 'order') {
      <div class="of-panel">
        <div class="of-fields">

          <!-- Security: kucate sid, lista nudi poklapanja, izbor upisuje description -->
          <div class="of-field of-span-2">
            <span class="of-label">Security</span>
            <div class="of-combo">
              <span class="of-lookup">
                <input #security type="text" placeholder="Search by SID…" autocomplete="off"
                       aria-label="Security" cdkFocusInitial
                       [disabled]="!editable()"
                       [value]="securityText()"
                       (input)="searchSecurity(security.value)"
                       (click)="securityOpen.set(true)"
                       (blur)="securityOpen.set(false)"
                       (keydown.enter)="pickFirstSecurity($event)"
                       (keydown.escape)="closeSecurityList($event)">
                <!-- TODO: otvaranje prozora hartije -->
                <button type="button" class="of-icon-btn" aria-label="Open security" disabled>
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                       stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4.5 2.5h5v5" />
                    <path d="M9.5 2.5l-7 7" />
                  </svg>
                </button>
              </span>

              @if (securityOpen()) {
                <!-- mousedown + preventDefault: izbor se desi pre nego što polje izgubi fokus -->
                <ul class="of-dropdown">
                  @for (s of securityMatches(); track s.sid) {
                    <li (mousedown)="$event.preventDefault(); pickSecurity(s)">
                      <span class="of-dd-sid">{{ s.sid }}</span>
                      <span>{{ s.description }}</span>
                    </li>
                  } @empty {
                    <li class="of-dd-empty">No match</li>
                  }
                </ul>
              }
            </div>
          </div>

          <label class="of-field">
            <span class="of-label">Trade Date</span>
            <input class="of-input" type="date" formControlName="tradeDate">
          </label>

          <label class="of-field">
            <span class="of-label">Quantity</span>
            <input class="of-input of-number" type="number" formControlName="quantity">
          </label>

          <label class="of-field">
            <span class="of-label">Manager</span>
            <select class="of-input" formControlName="managerId">
              <option [ngValue]="0" disabled>Select manager</option>
              @for (m of lookups.managers(); track m.id) {
                <option [ngValue]="m.id">{{ m.display }}</option>
              }
            </select>
          </label>

          <label class="of-field">
            <span class="of-label">Strategy</span>
            <select class="of-input" formControlName="strategyId">
              <option [ngValue]="0" disabled>Select strategy</option>
              @for (s of lookups.strategies(); track s.id) {
                <option [ngValue]="s.id">{{ s.display }}</option>
              }
            </select>
          </label>

        </div>
      </div>
    } @else {
      <div class="of-panel of-panel-alloc">
        <div class="of-grid-wrap">
          <table class="of-grid">
            <thead>
              <tr>
                <!-- TODO: kolone iz Allocation modela -->
                <th>#</th>
              </tr>
            </thead>
            <tbody>
              @for (a of allocations(); track $index) {
                <tr>
                  <td>{{ $index + 1 }}</td>
                </tr>
              } @empty {
                <tr>
                  <td class="of-empty" colspan="99">No allocations</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
        <div class="of-actions">
          <!-- TODO: nova alokacija -->
          <button type="button" class="of-btn of-btn-sm">New Allocation</button>
        </div>
      </div>
    }

    <footer class="of-footer">
      <!-- Book levo; aktivan za novi nalog i u Edit režimu -->
      <button type="submit" class="of-btn of-btn-primary of-left" [disabled]="saving() || !editable()">Book</button>

      <!-- Edit: aktivan samo kad je forma readonly (snimljen/postojeći nalog) -->
      <button type="button" class="of-btn" [disabled]="editable()" (click)="edit()">Edit</button>
      <!-- Refresh: ponovo učitaj nalog; novi nalog nema šta da učita -->
      <button type="button" class="of-btn" [disabled]="orderViewModel.isNew || saving()" (click)="refresh()">Refresh</button>
      <button type="button" class="of-btn" (click)="close()">Close</button>
    </footer>

  </form>
</app-window-frame>
