<app-window-frame [title]="vm.title" (closeClicked)="close()">
  <form class="form" (ngSubmit)="save()">

    <label class="field">
      <span class="label">Name</span>
      <input class="control" name="name" autocomplete="off" cdkFocusInitial [(ngModel)]="name" />
    </label>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <footer class="footer">
      <button type="submit" class="btn" [disabled]="saving() || !name().trim()">Save</button>
      <button type="button" class="btn" (click)="close()">Close</button>
    </footer>

  </form>
</app-window-frame>
