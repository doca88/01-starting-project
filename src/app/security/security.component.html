<app-window-frame [title]="vm.title" (closeClicked)="close()">
  <div class="main">
        <div class="fields">
        <label class="field">
        <span class="label">Sid</span>
        <input class="control" />
        </label>

        <label class="field">
        <span class="label">Description</span>
        <input class="control" />
        </label>
    </div>

    <footer class="footer">
        <button type="button" class="btn save" (click)="save()">Save</button>
        <button type="button" class="btn close" (click)="close()">Close</button>
    </footer>
</div>
</app-window-frame>
