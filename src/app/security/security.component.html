<app-window-frame [title]="vm.title" (closeClicked)="close()">
  <div class="main">
    <div class="fields">
      <label class="field">
        <span class="label">Sid</span>
        <!-- Sid dodeljuje baza: samo za čitanje -->
        <input class="control" [formField]="securityForm.sid" placeholder="auto" />
      </label>

      <label class="field">
        <span class="label">Description</span>
        <input class="control" [formField]="securityForm.description" [class.Error]="descriptionMissing()" />
      </label>
    </div>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <footer class="footer">
      <button type="button" class="btn save" (click)="save()" [disabled]="!canSave()">Save</button>
      <button type="button" class="btn edit" (click)="edit()" [disabled]="editable()">Edit</button>
      <button type="button" class="btn refresh" (click)="refresh()" [disabled]="vm.isNew || saving()">Refresh</button>
      <button type="button" class="btn close" (click)="close()">Close</button>
    </footer>
  </div>
</app-window-frame>
