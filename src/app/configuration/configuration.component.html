<div class="main">
  <div class="filters">
    <label class="field">
      <span>Type</span>
      <select class="control" [(ngModel)]="type">
        <option value="manager">Manager</option>
        <option value="strategy">Strategy</option>
      </select>
    </label>

    <label class="field">
      <span>Name</span>
      <input class="control" type="text" placeholder="contains…" autocomplete="off"
             [(ngModel)]="name" (keydown.enter)="search()" />
    </label>
  </div>

  <ag-grid-angular
    class="grid"
    [rowData]="rows()"
    [columnDefs]="columns"
    [getContextMenuItems]="getContextMenuItems"
    (rowDoubleClicked)="onRowDoubleClicked($event)" />

  <div class="footer">
    <button type="button" class="btn" (click)="search()">Search</button>
    <button type="button" class="btn" (click)="clear()">Clear</button>
  </div>
</div>

<nav class="create">
  <span class="title">CREATE NEW</span>

  <button type="button" class="item" (click)="openCreate('manager')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M19 8v6M22 11h-6" />
    </svg>
    <span>Manager</span>
  </button>

  <button type="button" class="item" (click)="openCreate('strategy')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <circle cx="12" cy="12" r="6" />
      <circle cx="12" cy="12" r="2" />
    </svg>
    <span>Strategy</span>
  </button>
</nav>
