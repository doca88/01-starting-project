<app-window-frame [title]="vm.title" (closeClicked)="cancel()">
  <form class="form" (ngSubmit)="ok()">

    <label class="field">
      <span class="label">Username</span>
      <input class="control" name="username" autocomplete="username" cdkFocusInitial [(ngModel)]="username" />
    </label>

    <label class="field">
      <span class="label">Password</span>
      <input class="control" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" />
    </label>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <footer class="footer">
      <button type="submit" class="btn" [disabled]="busy() || !username() || !password()">OK</button>
      <button type="button" class="btn" (click)="cancel()">Cancel</button>
    </footer>

  </form>
</app-window-frame>
