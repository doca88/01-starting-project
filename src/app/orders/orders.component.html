<main>
  <p>Orders ({{ orders().length }})</p>

  @if (error()) {
    <p class="error">Greška: {{ error() }}</p>
  }

  <ul class="grid">
    <li class="header" [style.grid-template-columns]="gridColumns()">
      @for (col of columns(); track col) {
        <span>{{ col }}</span>
      }
    </li>

    @for (order of orders(); track order['orderId']) {
      <li [style.grid-template-columns]="gridColumns()">
        @for (col of columns(); track col) {
          <span>{{ cell(order[col]) }}</span>
        }
      </li>
    }
  </ul>
</main>
