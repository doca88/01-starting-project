<app-securities-filter (search)="applyFilterFromFilterFields($event)" #filterBar />

<div class="title">Securities</div>

<ag-grid-angular
  class="grid"
  [rowData]="rows()"
  [columnDefs]="columns"
  [defaultColDef]="defaultColDef"
  [getRowId]="getRowId"
  [getContextMenuItems]="getContextMenuItems" />

<div class="footer">
    <!-- korak 3: otvara Security formu -->
    <button class="btn btn-ghost" (click)="openNew()">New Security</button>
    <button class="btn" (click)="applyFilter()">Search</button>
    <button class="btn" (click)="applied.set({ sid: '', description: '', mode: 'contains' })">Clear </button>
</div>
