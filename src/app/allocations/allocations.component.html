<div class="title">
  Allocations
  @if (orderId() !== null) {
    <span class="muted">Order Id [{{ orderId() }}]</span>
  } @else {
    <span class="muted">(select an order)</span>
  }
</div>

<ag-grid-angular
  class="grid"
  [rowData]="allocations()"
  [columnDefs]="columns"
  grandTotalRow="bottom"
  [suppressAggFuncInHeader]="true"
  [autoSizeStrategy]="{ type: 'fitCellContents' }" />
